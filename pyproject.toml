[project]
name = "mp3-player"
version = "3.0.0"
description = "Pure-Python music player with vinyl scratching, synced lyrics and playlists"
requires-python = ">=3.10"
dependencies = [
  "flet==1.0.5",
  "flet-audio==1.0.5",
  "mutagen>=1.47",
]

[tool.flet]
product = "MP3 Player"
company = "hpsingh2009"
copyright = "MIT"

[tool.flet.app]
path = "."

[tool.flet.android.permission]
"android.permission.READ_MEDIA_AUDIO" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.INTERNET" = true
